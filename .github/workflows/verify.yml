name: Verify EvidenceLock SIFT

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: |
          export PYTHONPATH=src
          python -m unittest discover -s tests -v

      - name: Run judge smoke test
        run: |
          export PYTHONPATH=src
          python tools/judge_smoke_test.py

      - name: Verify integrity manifest
        run: |
          export PYTHONPATH=src
          python -m evidencelock_sift.cli verify-manifest --manifest reports/integrity_manifest.json --repo-root .

      - name: Compile sources
        run: |
          python -m compileall -q src tests tools
