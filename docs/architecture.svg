<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-label="EvidenceLock SIFT architecture">
  <rect width="1080" height="640" fill="#f7f8fb"/>
  <style>
    .box{fill:#ffffff;stroke:#1f2937;stroke-width:2;rx:8}
    .trust{fill:#fff7ed;stroke:#c2410c;stroke-width:2;rx:8}
    .out{fill:#ecfdf5;stroke:#047857;stroke-width:2;rx:8}
    .txt{font-family:Arial, sans-serif;font-size:22px;fill:#111827}
    .small{font-family:Arial, sans-serif;font-size:16px;fill:#374151}
    .arrow{stroke:#111827;stroke-width:3;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827"/>
    </marker>
  </defs>
  <text x="40" y="52" class="txt" font-weight="700">EvidenceLock SIFT</text>
  <text x="40" y="82" class="small">Self-correcting Protocol SIFT workflow with evidence-bound confirmed claims.</text>

  <rect x="55" y="140" width="210" height="96" class="box"/>
  <text x="85" y="178" class="txt">Case Evidence</text>
  <text x="82" y="207" class="small">EVTX JSONL/XML</text>

  <rect x="330" y="120" width="250" height="136" class="box"/>
  <text x="360" y="158" class="txt">Typed DFIR Tools</text>
  <text x="360" y="188" class="small">hash, parse, search</text>
  <text x="360" y="214" class="small">optional SIFT wrappers</text>

  <rect x="650" y="120" width="260" height="136" class="box"/>
  <text x="690" y="158" class="txt">Agent Loop</text>
  <text x="684" y="188" class="small">plan -> collect -> draft</text>
  <text x="694" y="214" class="small">verify -> correct</text>

  <rect x="330" y="340" width="250" height="124" class="trust"/>
  <text x="376" y="380" class="txt">Verifier</text>
  <text x="354" y="410" class="small">No evidence refs?</text>
  <text x="354" y="436" class="small">Downgrade or repair.</text>

  <rect x="650" y="340" width="260" height="124" class="out"/>
  <text x="708" y="380" class="txt">Reports</text>
  <text x="682" y="410" class="small">investigation report</text>
  <text x="690" y="436" class="small">accuracy + logs</text>

  <line x1="265" y1="188" x2="330" y2="188" class="arrow"/>
  <line x1="580" y1="188" x2="650" y2="188" class="arrow"/>
  <line x1="780" y1="256" x2="780" y2="340" class="arrow"/>
  <line x1="650" y1="402" x2="580" y2="402" class="arrow"/>
  <line x1="580" y1="402" x2="650" y2="402" class="arrow"/>
  <line x1="455" y1="340" x2="455" y2="256" class="arrow"/>
  <line x1="580" y1="402" x2="650" y2="402" class="arrow"/>
</svg>
