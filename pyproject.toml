[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencelock-sift"
version = "0.1.0"
description = "Evidence-backed, self-correcting DFIR agent tools for Protocol SIFT."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OOYXLOO" }]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
evidencelock-sift = "evidencelock_sift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
